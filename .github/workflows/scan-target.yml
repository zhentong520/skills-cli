name: Scan (example for target repo)

# This workflow demonstrates how to run SpotBugs/PMD/ErrorProne in CI on a Java project,
# showing both Gradle and Maven examples.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scan-gradle:
    if: "!contains(github.event.head_commit.message, '[skip-gradle]')" # example conditional
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Run Gradle build
        run: ./gradlew clean build -x test
      - name: Run SpotBugs Gradle Plugin
        run: ./gradlew spotbugsMain spotbugsTest
      - name: Run PMD Gradle Plugin
        run: ./gradlew pmdMain pmdTest
      - name: Run ErrorProne (if configured)
        run: ./gradlew compileJava
      - name: Download skills-cli artifact
        uses: actions/download-artifact@v4
        with:
          name: skills-cli-jar
      - name: Run skills-cli to aggregate and output report
        run: |
          java -jar skills-cli-all.jar --path . --report json --enable-spotbugs false --enable-pmd false

  scan-maven:
    if: "!contains(github.event.head_commit.message, '[skip-maven]')" # example conditional
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17 and Maven
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Build (Maven) - skip tests for speed
        run: mvn -B -DskipTests verify
      - name: Run SpotBugs (Maven plugin)
        run: mvn -B -DskipTests spotbugs:spotbugs
      - name: Run PMD (Maven plugin)
        run: mvn -B -DskipTests pmd:pmd
      - name: (Optional) Run ErrorProne via Maven if configured in POM
        run: mvn -B -DskipTests verify
      - name: Download skills-cli artifact
        uses: actions/download-artifact@v4
        with:
          name: skills-cli-jar
      - name: Run skills-cli to aggregate report (Maven mode detected automatically)
        run: |
          java -jar skills-cli-all.jar --path . --report json --enable-spotbugs true --enable-pmd true